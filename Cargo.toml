[package]
name = "lunadb"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "A JSON/MessagePack document database exposed as an HTTP API"
license = "MIT"
authors = ["Marcos Gabriel Gomes <marcosgabrielgomes110@gmail.com>"]
repository = "https://github.com/marcosgabrielgomes110-collab/lunadb"
homepage = "https://github.com/marcosgabrielgomes110-collab/lunadb"
readme = "README.md"
keywords = ["database", "json", "http", "api", "axum"]
categories = ["database", "web-programming::http-server"]

[dependencies]
aes-gcm = "0.11"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
hkdf = "0.13"
rand = "0.10.3"
regex = "1"
rmp-serde = "1"
rpassword = "7.5.4"
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
